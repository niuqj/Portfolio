<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI RAW NR · 降噪前后对比</title>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#12161f;
    --line:rgba(255,255,255,.14);
    --text:#eef2ff;
    --muted:#9aa4b8;
    --accent:#6ea8ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(110,168,255,.22), transparent 60%),
      radial-gradient(800px 500px at 95% 0%, rgba(120,255,214,.12), transparent 55%),
      var(--bg);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  main{width:min(1180px,100%)}
  header{margin-bottom:24px}
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:0 0 12px;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.04);
    color:var(--muted);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }
  h1{
    margin:0 0 10px;
    font-size:clamp(26px,4vw,42px);
    line-height:1.15;
    letter-spacing:-.02em;
    font-weight:650;
  }
  .sub{margin:0;color:var(--muted);font-size:clamp(14px,1.6vw,16px);line-height:1.7}
  .compare{
    --pos:50%;
    position:relative;
    margin-top:28px;
    aspect-ratio:16/9;
    width:100%;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#000;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;
    cursor:ew-resize;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .layer{position:absolute;inset:0}
  .layer img{
    display:block;width:100%;height:100%;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .noisy{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
  .divider{
    position:absolute;
    top:0;bottom:0;
    left:var(--pos);
    width:3px;
    transform:translateX(-50%);
    background:rgba(255,255,255,.92);
    box-shadow:0 0 18px rgba(0,0,0,.6);
    cursor:ew-resize;
    outline:none;
  }
  .divider:focus-visible{
    background:var(--accent);
  }
  .handle{
    position:absolute;
    left:50%;top:50%;
    width:46px;height:46px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(15,19,28,.82);
    border:1px solid rgba(255,255,255,.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 26px rgba(0,0,0,.55);
    display:grid;
    place-items:center;
    color:#fff;
  }
  .handle svg{width:22px;height:22px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .tag{
    position:absolute;
    top:16px;
    padding:7px 12px;
    border-radius:8px;
    font-size:11px;
    font-weight:650;
    letter-spacing:.1em;
    color:#fff;
    background:rgba(8,10,15,.58);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    pointer-events:none;
    white-space:nowrap;
  }
  .tag.left{left:16px}
  .tag.right{right:16px}
  .hint{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 18px;
    margin-top:18px;
    color:var(--muted);
    font-size:13px;
  }
  .hint kbd{
    display:inline-block;
    padding:2px 7px;
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:6px;
    background:rgba(255,255,255,.05);
    color:#dbe4ff;
    font:inherit;
    font-size:12px;
  }
  .note{
    margin-top:26px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(255,255,255,.03);
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
  }
  .note strong{color:#cfd9ee;font-weight:600}
  @media (max-width:640px){
    body{padding:32px 14px}
    .tag{top:10px;font-size:10px;padding:5px 9px}
    .tag.left{left:10px}
    .tag.right{right:10px}
    .handle{width:38px;height:38px}
    .handle svg{width:18px;height:18px}
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">AI RAW NR · Interactive Demo</p>
    <h1>降噪前后对比</h1>
    <p class="sub">左右拖动中间的竖线，查看同一场景在噪声图与降噪图之间的差异。</p>
  </header>

  <section class="compare" id="compare" aria-label="降噪前后对比">
    <div class="layer"><img src="after.jpg" alt="降噪后的图像" draggable="false"></div>
    <div class="layer noisy" id="noisy"><img src="before.jpg" alt="带噪声的图像" draggable="false"></div>
    <div class="tag left">NOISY · 噪声</div>
    <div class="tag right">DENOISED · 降噪</div>
    <div class="divider" id="divider" role="slider" tabindex="0"
         aria-label="拖动对比噪声图与降噪图" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <span class="handle" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 8 4 12l4 4"/>
          <path d="M16 8l4 4-4 4"/>
        </svg>
      </span>
    </div>
  </section>

  <div class="hint">
    <span>拖动 / 点击画面移动对比线</span>
    <span>键盘 <kbd>←</kbd> <kbd>→</kbd> 微调</span>
  </div>

  <p class="note">
    <strong>占位示例：</strong>左侧噪声由合成噪声模拟，仅用于演示交互效果，不代表最终算法指标。后续会替换为真实 RAW 降噪结果。
  </p>
</main>

<script>
(function () {
  const wrap = document.getElementById('compare');
  const divider = document.getElementById('divider');
  let pos = 50;
  let dragging = false;

  function setPos(value) {
    pos = Math.min(100, Math.max(0, value));
    wrap.style.setProperty('--pos', pos + '%');
    divider.setAttribute('aria-valuenow', String(Math.round(pos)));
  }

  function posFromEvent(event) {
    const rect = wrap.getBoundingClientRect();
    if (rect.width === 0) return 50;
    return ((event.clientX - rect.left) / rect.width) * 100;
  }

  wrap.addEventListener('pointerdown', function (event) {
    if (event.button !== undefined && event.button !== 0) return;
    dragging = true;
    try { wrap.setPointerCapture(event.pointerId); } catch (e) {}
    setPos(posFromEvent(event));
    event.preventDefault();
  });

  wrap.addEventListener('pointermove', function (event) {
    if (!dragging) return;
    setPos(posFromEvent(event));
  });

  function endDrag(event) {
    dragging = false;
    try { wrap.releasePointerCapture(event.pointerId); } catch (e) {}
  }
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);

  divider.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft') { setPos(pos - 2); event.preventDefault(); }
    if (event.key === 'ArrowRight') { setPos(pos + 2); event.preventDefault(); }
    if (event.key === 'Home') { setPos(0); event.preventDefault(); }
    if (event.key === 'End') { setPos(100); event.preventDefault(); }
  });

  setPos(50);
})();
</script>
</body>
</html>
